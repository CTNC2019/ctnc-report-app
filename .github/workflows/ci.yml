name: CI

# Runs on every push and pull request against main — catches TypeScript errors, lint
# violations, and logic regressions (date-range filtering, migration formula, trend
# grouping) before they reach a deploy, since this project has no other CI gate today.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npx vitest run
